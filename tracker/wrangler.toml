name = "smartlogbook-tracker"
main = "src/index.js"
compatibility_date = "2026-09-01"

# Every minute (ADR-024). The Workers Free plan allows up to 5 cron triggers.
[triggers]
crons = ["* * * * *"]

# Live tracking state (ADR-024). Schema: migrations/*.sql
#   npx wrangler d1 migrations apply smartlogbook-tracker --remote
[[d1_databases]]
binding = "DB"
database_name = "smartlogbook-tracker"
database_id = "a5c73390-c24d-4d3d-a181-225a36a154c8"
migrations_dir = "migrations"

[vars]
VATSIM_CID = "1242058"
SIMBRIEF_ID = "MAOR561"
# Origins allowed to read the live state from the browser (the app's live screen).
APP_ORIGINS = "https://smart-log-book-eta.vercel.app,https://smart-log-book-rjo7.vercel.app,http://localhost:3100"

# Secret, set by the user (never in this file):
#   npx wrangler secret put TRACKER_SECRET
# The same value goes into Vercel as TRACKER_SECRET (ADR-031).

[observability]
enabled = true
